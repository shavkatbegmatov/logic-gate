# Logic Gate — Nginx sayti. setup.sh __SERVER_NAME__ ni domen (yoki "_") bilan almashtiradi.
# HTTPS bloki certbot tomonidan avtomatik qo'shiladi.

limit_req_zone $binary_remote_addr zone=logicgate_api:2m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root /opt/logicgate/web;
    index index.html;

    # Build vaqtida tayyorlangan .gz fayllar uzatiladi — siqish uchun CPU sarflanmaydi.
    gzip_static on;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types application/json text/css application/javascript image/svg+xml;

    client_max_body_size 64k;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors https://web.telegram.org; base-uri 'self'; form-action 'self'" always;

    # Fayl nomida xesh bor — abadiy keshlash mumkin.
    location /assets/ {
        expires max;
        access_log off;
        try_files $uri =404;
    }

    location /api/ {
        limit_req zone=logicgate_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
    }

    location = /healthz {
        allow 127.0.0.1;
        deny all;
        access_log off;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        expires -1;
        # Papkadagi index.html — qo'llanma sahifalari (/mantiqiy-elementlar/), qolgani — o'yin.
        try_files $uri $uri/index.html /index.html;
    }
}
