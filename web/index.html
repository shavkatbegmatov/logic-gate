<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07110d" />
    <meta name="description" content="Logic Gate — mantiqiy elementlardan sxema yig'ib, boshqotirmalarni yechadigan brauzer o'yini." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Telefonga ilova sifatida o'rnatish (HTTPS'da). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Logic Gate" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Logic Gate</title>
    <!-- Telegram va boshqa ilovalarda havola ko'rinishi. Manzil web/.env dagi VITE_SITE_URL dan olinadi. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Logic Gate" />
    <meta property="og:title" content="Logic Gate — mantiqiy sxemalar o'yini" />
    <meta property="og:description" content="NOT, AND, OR, XOR elementlaridan sxema yig'ib, 30 ta boshqotirmani yeching. Brauzerda, telefon va kompyuterda bepul." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="uz_UZ" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>O'yin ishlashi uchun JavaScript yoqilgan bo'lishi kerak.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
