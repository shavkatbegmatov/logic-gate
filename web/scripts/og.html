<!doctype html>
<!--
  Havola rasmi manbasi — o'yinning Plata mavzusida, bosh sahifadagi sxemaning o'zi: ikki tumbler (ikkalasi 1),
  45° burilishli yo'llar, AND elementi va yonib turgan chiroq; yonida nom — o'yindagi kabi oddiy qalin yozuv
  (2.16.0 gacha: oralari ochilgan ikki rangli mono "LOGIC GATE"). Shriftlar node_modules dagi IBM Plex.
  public/og.png (1200×630):
    chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 --screenshot=og.png og.html
  deploy/telegram/app-640x360.png (BotFather, 16:9):
    chrome --headless=new --hide-scrollbars --force-device-scale-factor=0.5333333 --window-size=1200,675 --screenshot=app-640x360.png "og.html?h=675"
  og.png o'zgarsa — web/index.html va scripts/pages.mjs dagi og.png?v=… ni oshiring (Telegram rasmni manzil bo'yicha keshlaydi).
-->
<html lang="uz">
<head>
<meta charset="utf-8" />
<title>Logic Gate OG</title>
<style>
  @font-face { font-family: 'Plex Mono'; font-weight: 600; src: url(../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Plex Sans'; font-weight: 400; src: url(../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Plex Sans'; font-weight: 600; src: url(../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Plex Sans'; font-weight: 700; src: url(../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-700-normal.woff2) format('woff2'); }
  html, body { margin: 0; width: 1200px; height: var(--h, 630px); overflow: hidden; }
  body {
    background: radial-gradient(circle at 14px 14px, #1f3a2c 1.6px, transparent 1.8px) 0 0 / 28px 28px, #0b1712;
    font-family: 'Plex Sans', system-ui, sans-serif;
    color: #ecf1e7;
    display: flex;
    align-items: center;
  }
  .art { width: 580px; height: 630px; flex: none; }
  .text { padding: 0 52px 0 30px; }
  h1 { margin: 0; font: 700 108px/1 'Plex Sans', sans-serif; letter-spacing: -0.03em; white-space: nowrap; }
  .tag { margin: 30px 0 0; font-size: 34px; line-height: 1.3; }
  .meta { margin-top: 26px; font-size: 25px; font-weight: 600; color: #ffb23e; }
  .glow { fill: none; stroke: rgba(255, 178, 62, 0.18); stroke-width: 24; stroke-linecap: round; stroke-linejoin: round; }
  .trace { fill: none; stroke: #ffb23e; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
  .lbl { font: 600 42px 'Plex Mono', monospace; fill: #9cb2a5; text-anchor: middle; dominant-baseline: central; }
  .track { fill: #ffb23e; stroke: #ffd38a; stroke-width: 3; }
  .knob { fill: #ecf1e7; stroke: #3a6a55; stroke-width: 2; }
  .knob-val { font: 600 26px 'Plex Mono', monospace; fill: #13271e; text-anchor: middle; dominant-baseline: central; }
  .port { fill: #ffb23e; }
  .gate { fill: #33290f; stroke: #ffb23e; stroke-width: 8; stroke-linejoin: round; }
  .gate-lbl { font: 600 34px 'Plex Mono', monospace; fill: #ffb23e; text-anchor: middle; dominant-baseline: central; }
  .halo { fill: rgba(255, 178, 62, 0.18); }
  .bezel { fill: #253a2f; stroke: #3a6a55; stroke-width: 3; }
  .lamp { fill: #ffb23e; stroke: #ffd38a; stroke-width: 3; }
  .shine { fill: rgba(255, 255, 255, 0.75); }
</style>
<script>
  // 16:9 nusxa uchun (Telegram ilova rasmi): og.html?h=675
  const h = new URLSearchParams(location.search).get('h');
  if (h) document.documentElement.style.setProperty('--h', `${Number(h)}px`);
</script>
</head>
<body>
  <svg class="art" viewBox="0 0 580 630">
    <!-- yo'llar: gorizontal → 45° → gorizontal, xuddi o'yin maydonidagidek -->
    <path class="glow" d="M190,222 H226 L272,268 H310" />
    <path class="glow" d="M190,408 H226 L272,362 H310" />
    <path class="glow" d="M470,315 H500" />
    <path class="trace" d="M190,222 H226 L272,268 H310" />
    <path class="trace" d="M190,408 H226 L272,362 H310" />
    <path class="trace" d="M470,315 H500" />
    <!-- kirishlar: tumbler (bosh sahifadagi kabi qutisiz), ikkalasi ham 1 -->
    <text class="lbl" x="56" y="223">A</text>
    <rect class="track" x="90" y="195" width="100" height="54" rx="27" />
    <circle class="knob" cx="163" cy="222" r="21" /><text class="knob-val" x="163" y="223">1</text>
    <text class="lbl" x="56" y="409">B</text>
    <rect class="track" x="90" y="381" width="100" height="54" rx="27" />
    <circle class="knob" cx="163" cy="408" r="21" /><text class="knob-val" x="163" y="409">1</text>
    <!-- AND elementi (yoniq) va kontaktlar -->
    <path class="gate" d="M310,225 H380 A90,90 0 0 1 380,405 H310 Z" />
    <text class="gate-lbl" x="378" y="316">AND</text>
    <circle class="port" cx="310" cy="268" r="11" />
    <circle class="port" cx="310" cy="362" r="11" />
    <circle class="port" cx="470" cy="315" r="11" />
    <!-- chiqish: chiroq -->
    <circle class="halo" cx="532" cy="315" r="50" />
    <circle class="bezel" cx="532" cy="315" r="34" />
    <circle class="lamp" cx="532" cy="315" r="24" />
    <circle class="shine" cx="523" cy="306" r="6.5" />
  </svg>
  <div class="text">
    <h1>Logic Gate</h1>
    <p class="tag">Mantiqiy elementlardan sxema yig'ing — boshqotirma o'yini</p>
    <div class="meta">42 daraja · kunlik masala · bepul</div>
  </div>
</body>
</html>
