<!doctype html>
<!--
  Open Graph rasmi (1200×630) manbasi. public/og.png shu sahifaning skrinshoti:
  brauzerda 1200×630 o'lchamda ochib, rasmga oling (masalan, Edge headless --screenshot).
-->
<html lang="uz">
<head>
<meta charset="utf-8" />
<title>Logic Gate OG</title>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 60% 70% at 28% 50%, rgba(61, 255, 160, 0.16), transparent 70%),
      radial-gradient(circle at 1px 1px, #183a2b 1.4px, transparent 1.6px) 0 0 / 28px 28px,
      #07110d;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #d9f6e7;
    display: flex;
    align-items: center;
  }
  .art { width: 560px; height: 630px; flex: none; }
  .text { padding-right: 70px; }
  h1 {
    margin: 0;
    font: 800 96px Consolas, ui-monospace, monospace;
    letter-spacing: 0.06em;
    line-height: 1;
    color: #3dffa0;
    text-shadow: 0 0 28px rgba(61, 255, 160, 0.55);
  }
  h1 span { display: block; color: #e8b45a; text-shadow: 0 0 28px rgba(232, 180, 90, 0.5); }
  .tag { margin: 30px 0 0; font-size: 34px; line-height: 1.3; }
  .meta {
    margin-top: 26px;
    font: 600 24px Consolas, ui-monospace, monospace;
    color: #ffd25e;
  }
  .wire { fill: none; stroke: #2c5444; stroke-width: 7; stroke-linecap: round; }
  .on { stroke: #3dffa0; }
  .glow { fill: none; stroke: #3dffa0; stroke-width: 22; opacity: 0.18; stroke-linecap: round; }
  .gate { fill: #0f2a20; stroke: #3dffa0; stroke-width: 7; stroke-linejoin: round; }
  .pin { fill: #0f221a; stroke: #e8b45a; stroke-width: 5; }
  .pin-on { stroke: #3dffa0; fill: #123a28; }
  .lbl { font: 700 40px Consolas, monospace; fill: #d9f6e7; text-anchor: middle; dominant-baseline: central; }
  .val { font: 700 40px Consolas, monospace; fill: #3dffa0; text-anchor: middle; dominant-baseline: central; }
  .dot { fill: #e8b45a; }
  .dot-on { fill: #3dffa0; }
</style>
</head>
<body>
  <svg class="art" viewBox="0 0 560 630">
    <!-- simlar -->
    <path class="glow" d="M150,230 C240,230 230,268 300,268" />
    <path class="glow" d="M150,400 C240,400 230,362 300,362" />
    <path class="glow" d="M430,315 C470,315 470,315 520,315" />
    <path class="wire on" d="M150,230 C240,230 230,268 300,268" />
    <path class="wire on" d="M150,400 C240,400 230,362 300,362" />
    <path class="wire on" d="M430,315 C470,315 470,315 520,315" />
    <!-- kirish pinlari -->
    <rect class="pin pin-on" x="40" y="190" width="100" height="80" rx="16" />
    <text class="lbl" x="72" y="230">A</text><text class="val" x="112" y="230">1</text>
    <rect class="pin pin-on" x="40" y="360" width="100" height="80" rx="16" />
    <text class="lbl" x="72" y="400">B</text><text class="val" x="112" y="400">1</text>
    <circle class="dot dot-on" cx="150" cy="230" r="11" />
    <circle class="dot dot-on" cx="150" cy="400" r="11" />
    <!-- AND elementi -->
    <path class="gate" d="M300,225 H370 A90,90 0 0 1 370,405 H300 Z" />
    <circle class="dot dot-on" cx="520" cy="315" r="14" />
  </svg>
  <div class="text">
    <h1>LOGIC<span>GATE</span></h1>
    <p class="tag">Mantiqiy elementlardan sxema yig'ing — boshqotirma o'yini</p>
    <div class="meta">30 daraja · reyting · bepul</div>
  </div>
</body>
</html>
