# main ga push qilinganda: testlar → Docker image → ghcr.io → (ixtiyoriy) Coolify'da qayta joylash.
# Pull request'da faqat testlar va build (image yig'ilmaydi, hech narsa joylanmaydi).
#
# Coolify avtomatik yangilanishi uchun repozitoriy Secrets'iga qo'shing:
#   COOLIFY_WEBHOOK — Coolify ilovasi → Webhooks → Deploy Webhook URL
#   COOLIFY_TOKEN   — Coolify → Keys & Tokens → API token (deploy huquqi bilan)
name: Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # pnpm Dockerfile'dagi bilan bir xil versiyada (pnpm/action-setup Node 20 da ishlaydi).
      - run: npm install -g pnpm@12.16.1
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm test && pnpm run build
        working-directory: web
      # Tutun testi: shu build'ni runner'dagi Chrome'da ochib, har mavzuda asosiy ekranlarni ikkala tilda
      # tekshiradi, AAA uslublarida 3D ekranni ham (web/scripts/ui-smoke.mjs; bog'liqliksiz, ~4 daqiqa). Ruscha matnlar uzunroq — tor ekranda
      # sig'masligi ko'proq o'sha tilda chiqadi. Yiqilsa — skrinshotlar artefaktda.
      - run: node scripts/ui-smoke.mjs --lang=uz,ru
        working-directory: web
        timeout-minutes: 10
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ui-skrinshotlar
          path: web/test-results/ui
          if-no-files-found: ignore
          retention-days: 7

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/logic-gate:latest
            ghcr.io/${{ github.repository_owner }}/logic-gate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Deploy, yangi versiyani kutish va kerak bo'lsa bir marta qayta urinish — skript ichida izohlangan.
      - name: Coolify'da joylash va tekshirish
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          SITE_URL: ${{ vars.LOGIC_GATE_URL || 'https://logic.noesis.uz' }}
        run: bash .github/scripts/deploy-coolify.sh
