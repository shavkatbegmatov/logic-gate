# main ga push qilinganda: testlar → Docker image → ghcr.io → (ixtiyoriy) Coolify'da qayta joylash.
#
# Coolify avtomatik yangilanishi uchun repozitoriy Secrets'iga qo'shing:
#   COOLIFY_WEBHOOK — Coolify ilovasi → Webhooks → Deploy Webhook URL
#   COOLIFY_TOKEN   — Coolify → Keys & Tokens → API token (deploy huquqi bilan)
name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm test && pnpm run build
        working-directory: web

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/logic-gate:latest
            ghcr.io/${{ github.repository_owner }}/logic-gate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Coolify 4.6: /api/v1/deploy faqat POST qabul qiladi (GET → 405).
      - name: Coolify'da qayta joylash
        id: deploy
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "COOLIFY_WEBHOOK yoki COOLIFY_TOKEN yo'q — Coolify'da qo'lda Redeploy qiling."
            exit 0
          fi
          curl -sS --fail-with-body --retry 2 --max-time 30 -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"
          echo
          echo "triggered=true" >> "$GITHUB_OUTPUT"

      # Webhook qabul qilingani deploy muvaffaqiyatli degani emas: eski konteyner ham 200 qaytaradi.
      # Shuning uchun sayt aynan shu commit versiyasini qaytarguncha kutiladi.
      - name: Yangi versiya ishga tushganini tekshirish
        if: steps.deploy.outputs.triggered == 'true'
        env:
          SITE_URL: ${{ vars.LOGIC_GATE_URL || 'http://logic-gate.170.168.6.82.sslip.io' }}
        run: |
          for i in $(seq 1 30); do
            v=$(curl -fsS --max-time 10 "$SITE_URL/api/version" | jq -r '.version' 2>/dev/null || true)
            # Diqqat: "${v:-...}" ichida apostrof ishlatmang — bash uni ochiq qo'shtirnoq deb o'qiydi.
            echo "urinish $i: ${v:-javob kelmadi}"
            if [ "$v" = "$GITHUB_SHA" ]; then
              echo "Yangi versiya ishlayapti: $SITE_URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::5 daqiqada yangi versiya ($GITHUB_SHA) ishga tushmadi — Coolify Deployment Logs'ni tekshiring"
          exit 1
