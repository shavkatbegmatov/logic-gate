# main ga push qilinganda: testlar → Docker image → ghcr.io → (ixtiyoriy) Coolify'da qayta joylash.
#
# Coolify avtomatik yangilanishi uchun repozitoriy Secrets'iga qo'shing:
#   COOLIFY_WEBHOOK — Coolify ilovasi → Webhooks → Deploy Webhook URL
#   COOLIFY_TOKEN   — Coolify → Keys & Tokens → API token (deploy huquqi bilan)
name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm test && pnpm run build
        working-directory: web

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/logic-gate:latest
            ghcr.io/${{ github.repository_owner }}/logic-gate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Coolify'da qayta joylash
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "COOLIFY_WEBHOOK yoki COOLIFY_TOKEN yo'q — Coolify'da qo'lda Redeploy qiling."
            exit 0
          fi
          curl -fsS --retry 3 --retry-all-errors --max-time 30 \
            -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"
